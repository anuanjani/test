<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Autonomous Tribal Survival - Balanced Logic v8</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; user-select: none; }
        canvas { display: block; background-color: #2e4a27; }
        
        #hud { position: absolute; top: 0; left: 0; width: 100%; background: rgba(0,0,0,0.85); padding: 10px; display: flex; justify-content: space-around; align-items: center; font-size: 13px; z-index: 10; border-bottom: 2px solid #444; flex-wrap: wrap;}
        .hud-item { font-weight: bold; margin: 0 5px; }
        .clickable { cursor: pointer; color: #ff6666; text-decoration: underline; }
        #hud-goal { color: #f1c40f; background: #333; padding: 4px 8px; border-radius: 4px; border: 1px solid #f1c40f; }
        
        .panel { position: absolute; background: rgba(0,0,0,0.8); border: 1px solid #555; padding: 10px; border-radius: 5px; font-size: 12px; z-index: 5; max-height: 75vh; overflow-y: auto; }
        
        #steward-panel { top: 60px; left: 10px; width: 220px; }
        details summary { cursor: pointer; color: #f1c40f; font-weight: bold; font-size: 14px; margin-bottom: 10px; outline: none; list-style: none; }
        details summary::-webkit-details-marker { display: none; }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #333;}
        .pred-input { width: 40px; background: #333; color: white; border: 1px solid #777; border-radius: 3px; text-align: center; }
        
        #speed-panel { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 5; }
        .speed-btn { padding: 10px 15px; background: #444; color: white; border: 2px solid #222; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .speed-btn.active { border-color: #2ecc71; background: #27ae60; }
        #spd0.active { border-color: #e74c3c; background: #c0392b; }
        
        #log-modal { display: none; position: absolute; top: 20%; left: 50%; transform: translateX(-50%); width: 300px; background: #222; border: 2px solid #e74c3c; padding: 15px; z-index: 20; border-radius: 8px; max-height: 50vh; overflow-y: auto; }
        #log-modal h3 { margin-top: 0; color: #e74c3c; }
    </style>
</head>
<body>

    <div id="hud">
        <span class="hud-item" id="hud-wood">🪵 0/50</span>
        <span class="hud-item" id="hud-stone">🪨 0/50</span>
        <span class="hud-item" id="hud-food">🍖 0/100</span>
        <span class="hud-item" id="hud-water">💧 0/100</span>
        <span class="hud-item" id="hud-tox" style="color:#9b59b6;">☠ 0/25</span>
        <span class="hud-item" id="hud-pop">👥 4 (🛏️ 4)</span>
        <span class="hud-item clickable" onclick="toggleModal()">💀 0</span>
        <span class="hud-item" id="hud-goal">AI: Survive</span>
        <span class="hud-item" id="hud-time">Year: 0, Day: 0</span>
    </div>

    <div id="steward-panel" class="panel">
        <details open>
            <summary>▼ Steward Access (Locks & Beasts)</summary>
            
            <h4 style="margin: 5px 0; color: #e74c3c;">Predators</h4>
            <div class="toggle-row">
                <label>🦁 Lions</label>
                <input type="number" id="lion-cnt" class="pred-input" min="1" max="15" value="3">
                <input type="checkbox" onchange="togglePredator('lion', this.checked)">
            </div>
            <div class="toggle-row">
                <label>🐘 Elephants</label>
                <input type="number" id="ele-cnt" class="pred-input" min="1" max="15" value="2">
                <input type="checkbox" onchange="togglePredator('elephant', this.checked)">
            </div>
            <h4 style="margin: 10px 0 5px 0; color: #3498db;">Resources</h4>
            <div id="locks-container"></div>
        </details>
    </div>

    <div id="speed-panel">
        <button class="speed-btn" id="spd0" onclick="setSpeed(0)">Pause</button>
        <button class="speed-btn active" id="spd1" onclick="setSpeed(1)">1x</button>
        <button class="speed-btn" id="spd5" onclick="setSpeed(5)">5x</button>
        <button class="speed-btn" id="spd10" onclick="setSpeed(10)">10x</button>
        <button class="speed-btn" id="spd20" onclick="setSpeed(20)">20x</button>
    </div>

    <div id="log-modal">
        <h3>Tribal Autopsy Log</h3>
        <ul id="dead-list" style="padding-left: 20px; font-size:12px;"></ul>
        <button onclick="toggleModal()" style="margin-top:10px; width:100%; padding: 8px; cursor: pointer;">Close</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let simSpeed = 1;
    let timeDay = 0;
    const TWO_YEARS = 730;
    const VISION_RADIUS = 180; 
    
    // FIX: Raised base caps to allow survival before depots are built.
    let storage = { wood: 15, stone: 15, food: 30, water: 30, meds: 0, tox: 0 };
    let caps = { wood: 50, stone: 50, food: 100, water: 100, meds: 25, tox: 25 };
    
    let deceased = [];
    let entityCounter = 5;
    
    let bldgs = { camps: 1, foodDepots: 0, woodDepots: 0, waterDepots: 0, medsDepots: 0, stoneDepots: 0 };

    const costs = {
        camp: { w: 20, st: 20, f: 10, wt: 10, name: "Build Camp (+4 Beds)", type: 'camp' },
        foodDepot: { w: 15, st: 15, name: "Build Food Depot", type: 'foodDepot' },
        woodDepot: { w: 15, st: 15, name: "Build Wood Depot", type: 'woodDepot' },
        waterDepot: { w: 15, st: 15, name: "Build Water Depot", type: 'waterDepot' },
        stoneDepot: { w: 15, st: 15, name: "Build Stone Depot", type: 'stoneDepot' }
    };

    let activeGoal = null;
    let activePredators = [];
    const w = canvas.width, h = canvas.height;
    
    const nodes = {
        river: { x: w*0.1, y: h*0.15, name: 'River', type: 'water', color: '#3498db', locked: false, show: true, stock: Infinity, max: Infinity },
        pond1: { x: w*0.85, y: h*0.85, name: 'Distant Pond', type: 'water', color: '#2980b9', locked: false, show: true, stock: 1500, max: 1500 },
        well: { x: w*0.45, y: h*0.55, name: 'Ground Water (Well)', type: 'water', color: '#00cec9', locked: false, show: false, stock: Infinity, max: Infinity },
        forest1: { x: w*0.8, y: h*0.2, name: 'Deep Forest', type: 'wood', color: '#27ae60', locked: false, show: true, stock: 3000, max: 3000 },
        quarry1: { x: w*0.7, y: h*0.3, name: 'Stone Quarry', type: 'stone', color: '#7f8c8d', locked: false, show: true, stock: 2500, max: 2500 },
        berries1: { x: w*0.2, y: h*0.8, name: 'Berry Grove 1', type: 'food', color: '#e74c3c', locked: false, show: true, stock: 1200, max: 1200 },
        boars1: { x: w*0.8, y: h*0.5, name: 'Boar Pack 1', type: 'hunt', color: '#d35400', locked: false, show: true, stock: 1500, max: 1500 },
        med_herbs1: { x: w*0.3, y: h*0.45, name: 'Medicinal Herbs', type: 'med', color: '#1abc9c', locked: false, show: true, stock: 500, max: 500 },
        tox_herbs1: { x: w*0.5, y: h*0.8, name: 'Toxic Herbs', type: 'tox', color: '#9b59b6', locked: false, show: true, stock: 500, max: 500 },
        camp1: { x: w*0.5, y: h*0.5, name: 'Camp 1', type: 'camp', color: '#f39c12', locked: false, show: true, stock: Infinity, max: Infinity }
    };

    let groundwaterResearch = 0;
    
    let baseMemory = { 
        camp1: { known: true, stock: Infinity, locked: false, lastSeenDay: 0 },
        river: { known: true, stock: Infinity, locked: false, lastSeenDay: 0 },
        berries1: { known: true, stock: 1200, locked: false, lastSeenDay: 0 },
        quarry1: { known: true, stock: 2500, locked: false, lastSeenDay: 0 },
        tox_herbs1: { known: true, stock: 500, locked: false, lastSeenDay: 0 }
    };
    let tribeKnowledge = JSON.parse(JSON.stringify(baseMemory));

    let entities = [
        { id: 'M1', sex: 'M', x: w*0.5, y: h*0.5, hp: 100, stam: 100, wat: 100, food: 100, daysUnsheltered: 0, hasBed: true, partnerId: null, state: 'IDLE', color: '#3498db', memory: JSON.parse(JSON.stringify(baseMemory)), scoutTarget: null, hasWeapon: false },
        { id: 'M2', sex: 'M', x: w*0.52, y: h*0.52, hp: 100, stam: 100, wat: 100, food: 100, daysUnsheltered: 0, hasBed: true, partnerId: null, state: 'IDLE', color: '#3498db', memory: JSON.parse(JSON.stringify(baseMemory)), scoutTarget: null, hasWeapon: false },
        { id: 'F1', sex: 'F', x: w*0.48, y: h*0.48, hp: 100, stam: 100, wat: 100, food: 100, daysUnsheltered: 0, hasBed: true, partnerId: null, state: 'IDLE', color: '#fd79a8', memory: JSON.parse(JSON.stringify(baseMemory)), scoutTarget: null, hasWeapon: false },
        { id: 'F2', sex: 'F', x: w*0.5, y: h*0.48, hp: 100, stam: 100, wat: 100, food: 100, daysUnsheltered: 0, hasBed: true, partnerId: null, state: 'IDLE', color: '#fd79a8', memory: JSON.parse(JSON.stringify(baseMemory)), scoutTarget: null, hasWeapon: false }
    ];

    function setupUI() {
        let locksHtml = '';
        for (let key in nodes) {
            if (nodes[key].type === 'camp' || nodes[key].type.includes('Depot') || key === 'well') continue;
            locksHtml += `<div class="toggle-row"><label>${nodes[key].name}</label><input type="checkbox" onchange="toggleLock('${key}', this.checked)"></div>`;
        }
        document.getElementById('locks-container').innerHTML = locksHtml;
    }

    function toggleLock(key, isLocked) { nodes[key].locked = isLocked; }
    function toggleModal() { let m = document.getElementById('log-modal'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; }
    function setSpeed(s) {
        simSpeed = s;
        document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('spd'+s).classList.add('active');
    }
    function logDeath(entity, cause) {
        let year = Math.floor(timeDay/365); let day = Math.floor(timeDay%365);
        deceased.push(`Yr ${year}, D ${day}: ${entity.id} (${entity.sex}) - ${cause}`);
        document.getElementById('dead-list').innerHTML += `<li>${deceased[deceased.length-1]}</li>`;
    }

    function togglePredator(type, isUnlocked) {
        if (isUnlocked) {
            let count = parseInt(document.getElementById(type === 'lion' ? 'lion-cnt' : 'ele-cnt').value) || 1;
            for(let i=0; i<count; i++) {
                activePredators.push({
                    type: type,
                    x: Math.random() > 0.5 ? 10 : w-10, y: Math.random() > 0.5 ? 10 : h-10,
                    hp: type === 'lion' ? 100 : 300, maxHp: type === 'lion' ? 100 : 300,
                    dmg: type === 'lion' ? 10 : 25, speed: type === 'lion' ? 1.4 : 0.8,
                    color: type === 'lion' ? '#f39c12' : '#7f8c8d', emoji: type === 'lion' ? '🦁' : '🐘'
                });
            }
        } else {
            activePredators = activePredators.filter(p => p.type !== type);
        }
    }

    function getClosestKnown(typeArray, entity) {
        let best = null, minDist = Infinity;
        for (let key in entity.memory) {
            let mem = entity.memory[key];
            let n = nodes[key];
            if (mem.known && n && n.show && !mem.locked && typeArray.includes(n.type) && mem.stock > 0) {
                let dist = Math.hypot(n.x - entity.x, n.y - entity.y);
                if (dist < minDist) { minDist = dist; best = n; }
            }
        }
        return best;
    }

    function determineColonyGoal() {
        let totalBeds = bldgs.camps * 4;
        if (entities.length >= totalBeds && storage.wood >= costs.camp.w && storage.stone >= costs.camp.st) return costs.camp;
        if (storage.food >= caps.food * 0.8) return costs.foodDepot;
        if (storage.wood >= caps.wood * 0.8) return costs.woodDepot;
        if (storage.water >= caps.water * 0.8) return costs.waterDepot;
        if (storage.stone >= caps.stone * 0.8) return costs.stoneDepot;
        return null; 
    }

    function constructGoal(goal) {
        storage.wood -= (goal.w || 0); storage.food -= (goal.f || 0); 
        storage.water -= (goal.wt || 0); storage.stone -= (goal.st || 0);
        
        let nx = (w*0.5) + (Math.random() - 0.5) * 400; let ny = (h*0.5) + (Math.random() - 0.5) * 400;
        let nKey = ''; let nObj = { x: nx, y: ny, locked: false, show: true, stock: Infinity, max: Infinity };

        if (goal.type === 'camp') {
            bldgs.camps++; nKey = 'camp' + bldgs.camps; nObj.name = 'Camp ' + bldgs.camps; nObj.type = 'camp'; nObj.color = '#f39c12';
        } else if (goal.type === 'foodDepot') {
            bldgs.foodDepots++; caps.food += 300; nKey = 'foodDepot' + bldgs.foodDepots; nObj.name = 'Food Depot'; nObj.type = 'foodDepot'; nObj.color = '#e67e22';
        } else if (goal.type === 'woodDepot') {
            bldgs.woodDepots++; caps.wood += 300; nKey = 'woodDepot' + bldgs.woodDepots; nObj.name = 'Wood Depot'; nObj.type = 'woodDepot'; nObj.color = '#8e44ad';
        } else if (goal.type === 'waterDepot') {
            bldgs.waterDepots++; caps.water += 300; nKey = 'waterDepot' + bldgs.waterDepots; nObj.name = 'Water Depot'; nObj.type = 'waterDepot'; nObj.color = '#3498db';
        } else if (goal.type === 'stoneDepot') {
            bldgs.stoneDepots++; caps.stone += 300; nKey = 'stoneDepot' + bldgs.stoneDepots; nObj.name = 'Stone Depot'; nObj.type = 'stoneDepot'; nObj.color = '#7f8c8d';
        }

        nodes[nKey] = nObj;
        tribeKnowledge[nKey] = { known: true, stock: Infinity, locked: false, lastSeenDay: timeDay };
        entities.forEach(e => e.memory[nKey] = JSON.parse(JSON.stringify(tribeKnowledge[nKey])));
    }

    function processAI(dt) {
        let dayInc = (dt * simSpeed) / 100;
        timeDay += dayInc;

        activeGoal = determineColonyGoal();
        document.getElementById('hud-goal').innerText = activeGoal ? `AI Goal: ${activeGoal.name}` : `AI: Survive & Expand`;

        for(let i = activePredators.length-1; i>=0; i--) {
            let p = activePredators[i];
            let closestE = null; let minD = Infinity;
            entities.forEach(e => {
                let d = Math.hypot(e.x - p.x, e.y - p.y);
                if(d < minD) { minD = d; closestE = e; }
            });

            if (closestE && minD < 300) {
                p.x += ((closestE.x - p.x) / minD) * p.speed * simSpeed * dt;
                p.y += ((closestE.y - p.y) / minD) * p.speed * simSpeed * dt;
            } else {
                p.x += (Math.random() - 0.5) * p.speed * simSpeed * dt;
                p.y += (Math.random() - 0.5) * p.speed * simSpeed * dt;
            }
        }

        let totalBeds = bldgs.camps * 4;
        let shelteredCount = entities.filter(e => e.hasBed).length;
        if (shelteredCount < totalBeds) {
            let unsheltered = entities.filter(e => !e.hasBed);
            if (unsheltered.length > 0) unsheltered[0].hasBed = true;
        }

        for (let i = entities.length - 1; i >= 0; i--) {
            let e = entities[i];
            
            for (let key in nodes) {
                let n = nodes[key];
                if (n.show && Math.hypot(n.x - e.x, n.y - e.y) < VISION_RADIUS) {
                    e.memory[key] = { known: true, stock: n.stock, locked: n.locked, lastSeenDay: timeDay };
                }
            }

            e.wat -= (0.015 * simSpeed * dt); e.food -= (0.010 * simSpeed * dt); e.stam -= (0.010 * simSpeed * dt);

            if (!e.hasBed) {
                e.daysUnsheltered += dayInc;
                if (e.daysUnsheltered >= TWO_YEARS) { logDeath(e, 'Exposure'); entities.splice(i, 1); continue; }
            } else { e.daysUnsheltered = 0; }

            if (e.hp <= 0) { logDeath(e, 'Killed in Action'); entities.splice(i, 1); continue; }
            if (e.wat <= 0) { logDeath(e, 'Dehydration'); entities.splice(i, 1); continue; }
            if (e.food <= 0) { logDeath(e, 'Starvation'); entities.splice(i, 1); continue; }

            let closestPred = null; let minPDist = Infinity;
            activePredators.forEach((p, idx) => {
                let d = Math.hypot(p.x - e.x, p.y - e.y);
                if (d < minPDist) { minPDist = d; closestPred = {p, idx}; }
            });

            let isFleeing = false; let isFighting = false;
            if (closestPred && minPDist < 120) {
                if (!e.hasWeapon) {
                    isFleeing = true; e.state = "Fleeing Beast!!";
                    e.x -= ((closestPred.p.x - e.x) / minPDist) * 2.5 * simSpeed * dt;
                    e.y -= ((closestPred.p.y - e.y) / minPDist) * 2.5 * simSpeed * dt;
                    if (minPDist < 20) e.hp -= (closestPred.p.dmg * simSpeed * dt);
                } else {
                    isFighting = true; e.state = "Fighting Beast 🗡️!";
                    if (minPDist > 15) {
                        e.x += ((closestPred.p.x - e.x) / minPDist) * 1.5 * simSpeed * dt;
                        e.y += ((closestPred.p.y - e.y) / minPDist) * 1.5 * simSpeed * dt;
                    } else {
                        closestPred.p.hp -= (30 * simSpeed * dt);
                        e.hp -= (closestPred.p.dmg * 0.2 * simSpeed * dt);
                        if (closestPred.p.hp <= 0) {
                            storage.food = Math.min(caps.food, storage.food + 100); 
                            activePredators.splice(closestPred.idx, 1);
                        }
                    }
                }
            }

            if (isFleeing || isFighting) continue;

            let targetNode = null;
            let speedMult = (e.stam <= 0) ? 0.5 : 1.0;
            let isDesperate = false;

            if (activePredators.length > 0 && !e.hasWeapon) {
                if (storage.wood >= 10 && storage.stone >= 10 && storage.tox >= 5) {
                    targetNode = getClosestKnown(['camp'], e); e.state = "Going to craft weapon!";
                    if (targetNode && Math.hypot(targetNode.x - e.x, targetNode.y - e.y) < 15) {
                        storage.wood -= 10; storage.stone -= 10; storage.tox -= 5;
                        e.hasWeapon = true; e.state = "Weapon Crafted!"; targetNode = null;
                    }
                } else {
                    if (storage.tox < 5) targetNode = getClosestKnown(['tox'], e);
                    else if (storage.stone < 10) targetNode = getClosestKnown(['stone'], e);
                    else if (storage.wood < 10) targetNode = getClosestKnown(['wood'], e);
                    isDesperate = true; e.state = "Gathering to Craft Weapon!"; speedMult = 1.8;
                }
            }

            if (!targetNode) {
                if (e.hp < 50) { 
                    targetNode = (storage.meds > 0 && bldgs.medsDepots > 0) ? getClosestKnown(['medsDepot'], e) : getClosestKnown(['med'], e); 
                    isDesperate = true; e.state = "Critical HP!"; speedMult = 1.5; 
                }
                else if (e.wat < 30) { 
                    targetNode = (storage.water > 0 && bldgs.waterDepots > 0) ? getClosestKnown(['waterDepot'], e) : getClosestKnown(['water'], e); 
                    isDesperate = true; e.state = "Dying of Thirst!"; speedMult = 2.0; 
                }
                else if (e.food < 30) { 
                    targetNode = (storage.food > 0 && bldgs.foodDepots > 0) ? getClosestKnown(['foodDepot'], e) : getClosestKnown(['food', 'hunt'], e); 
                    isDesperate = true; e.state = "Starving!"; speedMult = 2.0; 
                }
                
                if (!isDesperate) {
                    if (e.hp < 80) targetNode = (storage.meds > 0 && bldgs.medsDepots > 0) ? getClosestKnown(['medsDepot'], e) : getClosestKnown(['med'], e);
                    else if (e.wat < 50) targetNode = (storage.water > 10 && bldgs.waterDepots > 0) ? getClosestKnown(['waterDepot'], e) : getClosestKnown(['water'], e);
                    else if (e.food < 50) targetNode = (storage.food > 10 && bldgs.foodDepots > 0) ? getClosestKnown(['foodDepot'], e) : getClosestKnown(['food', 'hunt'], e);
                    else if (e.stam < 25) targetNode = getClosestKnown(['camp'], e);
                    else if (activeGoal) {
                        if (storage.wood < (activeGoal.w||0)) targetNode = getClosestKnown(['wood'], e);
                        else if (storage.stone < (activeGoal.st||0)) targetNode = getClosestKnown(['stone'], e);
                        else if (storage.water < (activeGoal.wt||0)) targetNode = getClosestKnown(['water'], e);
                        else if (storage.food < (activeGoal.f||0)) targetNode = getClosestKnown(['food', 'hunt'], e);
                        else {
                            targetNode = getClosestKnown(['camp'], e); 
                            if (Math.hypot(targetNode.x - e.x, targetNode.y - e.y) < 15 && e.stam > 10) {
                                constructGoal(activeGoal); e.state = "Constructed!"; activeGoal = null;
                            }
                        }
                    } else {
                        if (storage.water < caps.water * 0.5) targetNode = getClosestKnown(['water'], e);
                        else if (storage.food < caps.food * 0.5) targetNode = getClosestKnown(['food', 'hunt'], e);
                        else if (storage.wood < caps.wood * 0.5) targetNode = getClosestKnown(['wood'], e);
                        else if (storage.stone < caps.stone * 0.5) targetNode = getClosestKnown(['stone'], e);
                        else if (storage.tox < caps.tox * 0.5) targetNode = getClosestKnown(['tox'], e);
                        if (!targetNode) targetNode = getClosestKnown(['camp'], e); 
                    }
                }
            }

            if (targetNode) {
                let dist = Math.hypot(targetNode.x - e.x, targetNode.y - e.y);
                if (dist > 15) {
                    if (!e.state.includes("Craft")) e.state = `Going to ${targetNode.name}`;
                    e.x += ((targetNode.x - e.x) / dist) * simSpeed * speedMult;
                    e.y += ((targetNode.y - e.y) / dist) * simSpeed * speedMult;
                } else {
                    let gatherAmt = 2 * simSpeed * dt;
                    if (targetNode.stock !== Infinity) gatherAmt = Math.min(gatherAmt, targetNode.stock);
                    
                    if (targetNode.type === 'water' && gatherAmt > 0) {
                        e.wat = Math.min(100, e.wat + gatherAmt); storage.water = Math.min(caps.water, storage.water + gatherAmt);
                        if (targetNode.stock !== Infinity) targetNode.stock -= gatherAmt; e.state = "Drinking";
                    } else if (targetNode.type === 'food' && gatherAmt > 0) {
                        e.food = Math.min(100, e.food + gatherAmt); storage.food = Math.min(caps.food, storage.food + gatherAmt * 0.5);
                        if (targetNode.stock !== Infinity) targetNode.stock -= gatherAmt; e.state = "Gathering Food";
                    } else if (targetNode.type === 'stone' && gatherAmt > 0) {
                        storage.stone = Math.min(caps.stone, storage.stone + gatherAmt); e.stam -= (0.2 * simSpeed * dt);
                        if (targetNode.stock !== Infinity) targetNode.stock -= gatherAmt; e.state = "Mining Stone";
                    } else if (targetNode.type === 'wood' && gatherAmt > 0) {
                        storage.wood = Math.min(caps.wood, storage.wood + gatherAmt); e.stam -= (0.1 * simSpeed * dt);
                        if (targetNode.stock !== Infinity) targetNode.stock -= gatherAmt; e.state = "Chopping Wood";
                    } else if (targetNode.type === 'tox' && gatherAmt > 0) {
                        storage.tox = Math.min(caps.tox, storage.tox + gatherAmt); e.hp -= (0.5 * simSpeed * dt);
                        if (targetNode.stock !== Infinity) targetNode.stock -= gatherAmt; e.state = "Gathering Toxins";
                    } else if (targetNode.type === 'camp' || targetNode.type.includes('Depot')) {
                        e.stam = Math.min(100, e.stam + 0.5 * simSpeed * dt);
                        if (!e.state.includes("Craft")) e.state = "At Base";
                        
                        if (e.wat < 100 && storage.water > 0 && targetNode.type === 'waterDepot') {
                            let drink = Math.min(100 - e.wat, storage.water, 2 * simSpeed * dt);
                            e.wat += drink; storage.water -= drink; e.state = "Drinking from Storage";
                        }
                        if (e.food < 100 && storage.food > 0 && targetNode.type === 'foodDepot') {
                            let eat = Math.min(100 - e.food, storage.food, 2 * simSpeed * dt);
                            e.food += eat; storage.food -= eat; e.state = "Eating from Storage";
                        }
                        
                        if (targetNode.type === 'camp') {
                            for (let key in e.memory) {
                                if (!tribeKnowledge[key] || e.memory[key].lastSeenDay > tribeKnowledge[key].lastSeenDay) tribeKnowledge[key] = JSON.parse(JSON.stringify(e.memory[key]));
                            }
                            for (let key in tribeKnowledge) {
                                if (!e.memory[key] || tribeKnowledge[key].lastSeenDay > e.memory[key].lastSeenDay) e.memory[key] = JSON.parse(JSON.stringify(tribeKnowledge[key]));
                            }
                        }
                    }
                }
            } else {
                if (!e.scoutTarget || Math.hypot(e.scoutTarget.x - e.x, e.scoutTarget.y - e.y) < 15) {
                    e.scoutTarget = { x: 50 + Math.random() * (canvas.width - 100), y: 50 + Math.random() * (canvas.height - 100) };
                }
                let dist = Math.hypot(e.scoutTarget.x - e.x, e.scoutTarget.y - e.y);
                e.state = isDesperate ? "Panic Searching!" : "Scouting";
                e.x += ((e.scoutTarget.x - e.x) / dist) * simSpeed * speedMult;
                e.y += ((e.scoutTarget.y - e.y) / dist) * simSpeed * speedMult;
            }
        }
        
        for (let key in nodes) {
            let n = nodes[key];
            if (n.show && n.stock <= 0 && n.stock !== Infinity) {
                n.x = 50 + Math.random() * (canvas.width - 100); n.y = 50 + Math.random() * (canvas.height - 100);
                n.stock = n.max;
                if (tribeKnowledge[key]) tribeKnowledge[key].known = false;
                entities.forEach(ent => {
                    if (ent.memory[key]) ent.memory[key].known = false;
                    if (ent.state.includes(n.name)) ent.state = "Resource vanished!";
                });
            }
        }
    }

    let lastTime = performance.now();
    function loop(now) {
        let dt = (now - lastTime) / 16;
        if (dt > 10) dt = 1; 
        lastTime = now;
        
        processAI(dt);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let key in nodes) {
            let n = nodes[key];
            if (!n.show) continue;
            ctx.fillStyle = (n.stock <= 0) ? 'rgba(0,0,0,0.5)' : n.color;
            if (n.type.includes('Depot') || n.type === 'camp') ctx.fillRect(n.x - 20, n.y - 20, 40, 40);
            else { ctx.beginPath(); ctx.arc(n.x, n.y, 25, 0, Math.PI*2); ctx.fill(); }
            
            ctx.fillStyle = 'white'; ctx.font = '12px Arial'; ctx.textAlign = 'center';
            ctx.fillText(n.name, n.x, n.y - 30);
            if (n.stock !== Infinity) {
                ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '10px Arial';
                ctx.fillText(`${Math.ceil(Math.max(0, n.stock))}/${n.max}`, n.x, n.y + 20);
            }
            if (n.locked && n.stock > 0) { ctx.fillStyle = 'red'; ctx.font = '20px Arial'; ctx.fillText('🔒', n.x, n.y + 8); }
        }

        activePredators.forEach(p => {
            ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 15, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'red'; ctx.fillRect(p.x - 15, p.y - 20, 30, 4);
            ctx.fillStyle = '#2ecc71'; ctx.fillRect(p.x - 15, p.y - 20, 30 * (p.hp/p.maxHp), 4);
            ctx.fillStyle = 'white'; ctx.font = '16px Arial'; ctx.fillText(p.emoji, p.x-8, p.y+6);
        });

        entities.forEach(e => {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; ctx.beginPath(); ctx.arc(e.x, e.y, VISION_RADIUS, 0, Math.PI*2); ctx.stroke();
            ctx.fillStyle = e.color; ctx.beginPath(); ctx.arc(e.x, e.y, 10, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'red'; ctx.fillRect(e.x - 15, e.y - 20, 30, 4);
            ctx.fillStyle = '#2ecc71'; ctx.fillRect(e.x - 15, e.y - 20, 30 * (e.hp/100), 4);
            ctx.fillStyle = 'white'; ctx.font = '10px Arial'; ctx.textAlign = 'center';
            
            let nameTag = e.id + (e.hasWeapon ? ' 🗡️' : '');
            ctx.fillText(nameTag, e.x, e.y + 15);
            ctx.fillText(e.state, e.x, e.y - 25);
        });

        document.getElementById('hud-wood').innerText = `🪵 ${Math.floor(storage.wood)}/${caps.wood}`;
        document.getElementById('hud-stone').innerText = `🪨 ${Math.floor(storage.stone)}/${caps.stone}`;
        document.getElementById('hud-food').innerText = `🍖 ${Math.floor(storage.food)}/${caps.food}`;
        document.getElementById('hud-water').innerText = `💧 ${Math.floor(storage.water)}/${caps.water}`;
        document.getElementById('hud-tox').innerText = `☠️ ${Math.floor(storage.tox)}/${caps.tox}`;
        document.getElementById('hud-pop').innerText = `👥 ${entities.length} (🛏️ ${bldgs.camps * 4})`;
        
        let y = Math.floor(timeDay/365); let d = Math.floor(timeDay%365);
        document.getElementById('hud-time').innerText = `Year: ${y}, Day: ${d} (v8)`;
        document.querySelector('.clickable').innerText = `💀 ${deceased.length}`;

        requestAnimationFrame(loop);
    }

    setupUI();
    loop(performance.now());
</script>
</body>
</html>
