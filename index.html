<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Autonomous Tribal Survival - Smart Pantry AI</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; user-select: none; }
        canvas { display: block; background-color: #2e4a27; }
        
        #hud { position: absolute; top: 0; left: 0; width: 100%; background: rgba(0,0,0,0.85); padding: 10px; display: flex; justify-content: space-around; align-items: center; font-size: 13px; z-index: 10; border-bottom: 2px solid #444; }
        .hud-item { font-weight: bold; }
        .clickable { cursor: pointer; color: #ff6666; text-decoration: underline; }
        #hud-goal { color: #f1c40f; background: #333; padding: 4px 8px; border-radius: 4px; border: 1px solid #f1c40f; }
        
        .panel { position: absolute; background: rgba(0,0,0,0.8); border: 1px solid #555; padding: 10px; border-radius: 5px; font-size: 12px; z-index: 5; max-height: 75vh; overflow-y: auto; }
        
        #steward-panel { top: 50px; left: 10px; width: 180px; }
        details summary { cursor: pointer; color: #f1c40f; font-weight: bold; font-size: 14px; margin-bottom: 10px; outline: none; list-style: none; }
        details summary::-webkit-details-marker { display: none; }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #333;}
        
        #speed-panel { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 5; }
        .speed-btn { padding: 10px 15px; background: #444; color: white; border: 2px solid #222; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .speed-btn.active { border-color: #2ecc71; background: #27ae60; }
        #spd0.active { border-color: #e74c3c; background: #c0392b; }
        
        #log-modal { display: none; position: absolute; top: 20%; left: 50%; transform: translateX(-50%); width: 300px; background: #222; border: 2px solid #e74c3c; padding: 15px; z-index: 20; border-radius: 8px; max-height: 50vh; overflow-y: auto; }
        #log-modal h3 { margin-top: 0; color: #e74c3c; }
    </style>
</head>
<body>

    <div id="hud">
        <span class="hud-item" id="hud-wood">Wood: 5/100</span>
        <span class="hud-item" id="hud-food">Food: 5/100</span>
        <span class="hud-item" id="hud-water">Water: 5/100</span>
        <span class="hud-item" id="hud-pop">Pop: 4 (Beds: 2)</span>
        <span class="hud-item clickable" onclick="toggleModal()">☠️ Dead: 0</span>
        <span class="hud-item" id="hud-goal">AI Goal: Survive</span>
        <span class="hud-item" id="hud-day">Day: 0</span>
    </div>

    <div id="steward-panel" class="panel">
        <details open>
            <summary>▼ Steward Access (Locks)</summary>
            <div id="locks-container"></div>
        </details>
    </div>

    <div id="speed-panel">
        <button class="speed-btn" id="spd0" onclick="setSpeed(0)">Pause</button>
        <button class="speed-btn active" id="spd1" onclick="setSpeed(1)">1x</button>
        <button class="speed-btn" id="spd5" onclick="setSpeed(5)">5x</button>
        <button class="speed-btn" id="spd10" onclick="setSpeed(10)">10x</button>
        <button class="speed-btn" id="spd20" onclick="setSpeed(20)">20x</button>
    </div>

    <div id="log-modal">
        <h3>Tribal Autopsy Log</h3>
        <ul id="dead-list" style="padding-left: 20px; font-size:12px;"></ul>
        <button onclick="toggleModal()" style="margin-top:10px; width:100%; padding: 8px; cursor: pointer;">Close</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let simSpeed = 1;
    let timeDay = 0;
    const TWO_YEARS = 730;
    const VISION_RADIUS = 180; 
    
    let storage = { wood: 5, food: 5, water: 5 };
    let caps = { wood: 100, food: 100, water: 100 };
    let deceased = [];
    let entityCounter = 5;
    
    let bldgs = { camp: { level: 0, cap: 2 }, foodDepot: { level: -1 }, woodDepot: { level: -1 }, waterDepot: { level: -1 } };

    const costs = {
        camp0: { w: 80, f: 25, wt: 80, name: "Build New Camp", type: 'camp', targetLevel: 0 },
        camp1: { w: 55, f: 18, wt: 55, name: "Upgrade Camp L1", type: 'camp', targetLevel: 1 },
        camp2: { w: 90, f: 55, wt: 100, name: "Upgrade Camp L2", type: 'camp', targetLevel: 2 },
        food0: { w: 30, f: 40, wt: 40, name: "Build Food Depot", type: 'foodDepot', targetLevel: 0, newCap: 120 },
        food1: { w: 55, f: 90, wt: 50, name: "Upgrade Food Depot L1", type: 'foodDepot', targetLevel: 1, newCap: 250 },
        food2: { w: 55, f: 105, wt: 80, name: "Upgrade Food Depot L2", type: 'foodDepot', targetLevel: 2, newCap: 500 },
        wood0: { w: 40, f: 15, wt: 30, name: "Build Wood Depot", type: 'woodDepot', targetLevel: 0, newCap: 150 },
        wood1: { w: 90, f: 55, wt: 50, name: "Upgrade Wood Depot L1", type: 'woodDepot', targetLevel: 1, newCap: 300 },
        wood2: { w: 120, f: 55, wt: 80, name: "Upgrade Wood Depot L2", type: 'woodDepot', targetLevel: 2, newCap: 600 },
        water0: { w: 30, f: 15, wt: 40, name: "Build Water Depot", type: 'waterDepot', targetLevel: 0, newCap: 150 },
        water1: { w: 50, f: 55, wt: 90, name: "Upgrade Water Depot L1", type: 'waterDepot', targetLevel: 1, newCap: 300 },
        water2: { w: 80, f: 55, wt: 120, name: "Upgrade Water Depot L2", type: 'waterDepot', targetLevel: 2, newCap: 600 },
    };

    let activeGoal = null;
    const w = canvas.width, h = canvas.height;
    
    const nodes = {
        river: { x: w*0.1, y: h*0.15, name: 'River (Infinite)', type: 'water', color: '#3498db', locked: false, show: true, stock: Infinity, max: Infinity },
        pond1: { x: w*0.85, y: h*0.85, name: 'Distant Pond', type: 'water', color: '#2980b9', locked: false, show: true, stock: 1500, max: 1500 },
        pond2: { x: w*0.35, y: h*0.7, name: 'Small Pond', type: 'water', color: '#2980b9', locked: false, show: true, stock: 800, max: 800 },
        well: { x: w*0.45, y: h*0.55, name: 'Ground Water (Well)', type: 'water', color: '#00cec9', locked: false, show: false, stock: Infinity, max: Infinity },
        forest1: { x: w*0.8, y: h*0.2, name: 'Deep Forest', type: 'wood', color: '#27ae60', locked: false, show: true, stock: 3000, max: 3000 },
        forest2: { x: w*0.2, y: h*0.3, name: 'Sparse Woods', type: 'wood', color: '#2ecc71', locked: false, show: true, stock: 1000, max: 1000 },
        berries1: { x: w*0.2, y: h*0.8, name: 'Berry Grove 1', type: 'food', color: '#e74c3c', locked: false, show: true, stock: 1200, max: 1200 },
        berries2: { x: w*0.7, y: h*0.7, name: 'Berry Grove 2', type: 'food', color: '#e74c3c', locked: false, show: true, stock: 800, max: 800 },
        boars1: { x: w*0.8, y: h*0.5, name: 'Boar Pack 1', type: 'hunt', color: '#d35400', locked: false, show: true, stock: 1500, max: 1500 },
        boars2: { x: w*0.4, y: h*0.2, name: 'Boar Pack 2', type: 'hunt', color: '#d35400', locked: false, show: true, stock: 1000, max: 1000 },
        med_herbs1: { x: w*0.3, y: h*0.45, name: 'Medicinal Herbs', type: 'med', color: '#1abc9c', locked: false, show: true, stock: 500, max: 500 },
        tox_herbs1: { x: w*0.5, y: h*0.8, name: 'Toxic Herbs 1', type: 'tox', color: '#9b59b6', locked: false, show: true, stock: 300, max: 300 },
        tox_herbs2: { x: w*0.65, y: h*0.3, name: 'Toxic Herbs 2', type: 'tox', color: '#8e44ad', locked: false, show: true, stock: 300, max: 300 },
        camp: { x: w*0.5, y: h*0.5, name: 'Camp', type: 'camp', color: '#f39c12', locked: false, show: true, stock: Infinity, max: Infinity }
    };

    let groundwaterResearch = 0;
    
    let baseMemory = { 
        camp: { known: true, stock: Infinity, locked: false, lastSeenDay: 0 },
        river: { known: true, stock: Infinity, locked: false, lastSeenDay: 0 },
        berries1: { known: true, stock: 1200, locked: false, lastSeenDay: 0 }
    };
    let tribeKnowledge = JSON.parse(JSON.stringify(baseMemory));

    let entities = [
        { id: 'M1', sex: 'M', x: w*0.5, y: h*0.5, hp: 100, stam: 100, wat: 100, food: 100, daysUnsheltered: 0, hasBed: true, state: 'IDLE', color: '#3498db', memory: JSON.parse(JSON.stringify(baseMemory)), scoutTarget: null },
        { id: 'M2', sex: 'M', x: w*0.52, y: h*0.52, hp: 100, stam: 100, wat: 100, food: 100, daysUnsheltered: 0, hasBed: true, state: 'IDLE', color: '#3498db', memory: JSON.parse(JSON.stringify(baseMemory)), scoutTarget: null },
        { id: 'F1', sex: 'F', x: w*0.48, y: h*0.48, hp: 100, stam: 100, wat: 100, food: 100, daysUnsheltered: 0, hasBed: false, state: 'IDLE', color: '#fd79a8', memory: JSON.parse(JSON.stringify(baseMemory)), scoutTarget: null },
        { id: 'F2', sex: 'F', x: w*0.5, y: h*0.48, hp: 100, stam: 100, wat: 100, food: 100, daysUnsheltered: 0, hasBed: false, state: 'IDLE', color: '#fd79a8', memory: JSON.parse(JSON.stringify(baseMemory)), scoutTarget: null }
    ];

    function setupUI() {
        let locksHtml = '';
        for (let key in nodes) {
            if (key === 'camp' || key === 'well') continue;
            locksHtml += `<div class="toggle-row"><label>${nodes[key].name}</label><input type="checkbox" onchange="toggleLock('${key}', this.checked)"></div>`;
        }
        document.getElementById('locks-container').innerHTML = locksHtml;
    }

    function toggleLock(key, isLocked) { nodes[key].locked = isLocked; }
    function toggleModal() { let m = document.getElementById('log-modal'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; }
    function setSpeed(s) {
        simSpeed = s;
        document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('spd'+s).classList.add('active');
    }
    function logDeath(entity, cause) {
        deceased.push(`Day ${Math.floor(timeDay)}: ${entity.id} (${entity.sex}) - ${cause}`);
        document.getElementById('dead-list').innerHTML += `<li>${deceased[deceased.length-1]}</li>`;
    }

    function getClosestKnown(typeArray, entity) {
        let best = null, minDist = Infinity;
        for (let key in entity.memory) {
            let mem = entity.memory[key];
            let n = nodes[key];
            if (mem.known && n && n.show && !mem.locked && typeArray.includes(n.type) && mem.stock > 0) {
                let dist = Math.hypot(n.x - entity.x, n.y - entity.y);
                if (dist < minDist) { minDist = dist; best = n; }
            }
        }
        return best;
    }

    function determineColonyGoal() {
        if (entities.length > bldgs.camp.cap) {
            if (bldgs.camp.level === 0) return costs.camp1;
            if (bldgs.camp.level === 1) return costs.camp2;
            if (bldgs.camp.level === 2) return costs.camp0; 
        }
        if (storage.food > caps.food * 0.8) {
            if (bldgs.foodDepot.level === -1) return costs.food0;
            if (bldgs.foodDepot.level === 0) return costs.food1;
            if (bldgs.foodDepot.level === 1) return costs.food2;
        }
        if (storage.wood > caps.wood * 0.8) {
            if (bldgs.woodDepot.level === -1) return costs.wood0;
            if (bldgs.woodDepot.level === 0) return costs.wood1;
            if (bldgs.woodDepot.level === 1) return costs.wood2;
        }
        if (storage.water > caps.water * 0.8) {
            if (bldgs.waterDepot.level === -1) return costs.water0;
            if (bldgs.waterDepot.level === 0) return costs.water1;
            if (bldgs.waterDepot.level === 1) return costs.water2;
        }
        return null; 
    }

    function constructGoal(goal) {
        storage.wood -= goal.w; storage.food -= goal.f; storage.water -= goal.wt;
        if (goal.type === 'camp') {
            if (goal.targetLevel === 0) bldgs.camp.cap += 2;
            else if (goal.targetLevel === 1) { bldgs.camp.level = 1; bldgs.camp.cap = 3; }
            else if (goal.targetLevel === 2) { bldgs.camp.level = 2; bldgs.camp.cap = 5; }
        } else if (goal.type === 'foodDepot') { bldgs.foodDepot.level = goal.targetLevel; caps.food = goal.newCap; }
        else if (goal.type === 'woodDepot') { bldgs.woodDepot.level = goal.targetLevel; caps.wood = goal.newCap; }
        else if (goal.type === 'waterDepot') { bldgs.waterDepot.level = goal.targetLevel; caps.water = goal.newCap; }
    }

    function processAI(dt) {
        let dayInc = (dt * simSpeed) / 100;
        timeDay += dayInc;

        activeGoal = determineColonyGoal();
        document.getElementById('hud-goal').innerText = activeGoal ? `AI Goal: ${activeGoal.name}` : `AI Goal: Survive & Stockpile`;

        entities.forEach(e => {
            if (!e.partnerId && e.hp > 60) {
                let candidates = entities.filter(o => o.sex !== e.sex && !o.partnerId && o.hp > 60);
                if (candidates.length > 0) {
                    candidates.sort((a,b) => b.hp - a.hp); 
                    e.partnerId = candidates[0].id;
                    candidates[0].partnerId = e.id;
                }
            }
        });

        let shelteredCount = entities.filter(e => e.hasBed).length;
        if (shelteredCount < bldgs.camp.cap) {
            let unsheltered = entities.filter(e => !e.hasBed);
            if (unsheltered.length > 0) unsheltered[0].hasBed = true;
        }

        for (let i = entities.length - 1; i >= 0; i--) {
            let e = entities[i];
            
            // Vision Radius Discovery
            for (let key in nodes) {
                let n = nodes[key];
                if (n.show && Math.hypot(n.x - e.x, n.y - e.y) < VISION_RADIUS) {
                    e.memory[key] = { known: true, stock: n.stock, locked: n.locked, lastSeenDay: timeDay };
                }
            }

            // Slower Metabolism to support long travel
            e.wat -= (0.015 * simSpeed * dt);
            e.food -= (0.010 * simSpeed * dt);
            e.stam -= (0.010 * simSpeed * dt);

            if (!e.hasBed) {
                e.daysUnsheltered += dayInc;
                if (e.daysUnsheltered >= TWO_YEARS) { logDeath(e, 'Exposure (2 Yrs Unsheltered)'); entities.splice(i, 1); continue; }
            } else { e.daysUnsheltered = 0; }

            if (e.hp <= 0) { logDeath(e, 'Injuries / Poison'); entities.splice(i, 1); continue; }
            if (e.wat <= 0) { logDeath(e, 'Dehydration'); entities.splice(i, 1); continue; }
            if (e.food <= 0) { logDeath(e, 'Starvation'); entities.splice(i, 1); continue; }

            let targetNode = null;
            let speedMult = (e.stam <= 0) ? 0.5 : 1.0;
            let isDesperate = false;

            // BUG FIX: The AI now knows to eat/drink from the Camp Storage!
            if (e.wat < 30) { 
                targetNode = (storage.water > 0) ? nodes.camp : getClosestKnown(['water'], e); 
                isDesperate = true; e.state = "Dying of Thirst!"; speedMult = 2.0; 
            }
            else if (e.food < 30) { 
                targetNode = (storage.food > 0) ? nodes.camp : (e.hp < 50 ? getClosestKnown(['food'], e) : getClosestKnown(['food', 'hunt'], e)); 
                isDesperate = true; e.state = "Starving!"; speedMult = 2.0; 
            }
            else if (e.hp < 40) { 
                targetNode = getClosestKnown(['med'], e) || nodes.camp; 
                isDesperate = true; e.state = "Critical HP!"; 
            }
            else if (!e.hasBed && e.daysUnsheltered > (TWO_YEARS - 30)) {
                targetNode = nodes.camp; 
                isDesperate = true; e.state = "Exposure Imminent!";
            }
            
            if (!isDesperate) {
                if (e.hp < 80) { targetNode = getClosestKnown(['med'], e); if(!targetNode) targetNode = nodes.camp; }
                else if (e.wat < 50) { targetNode = (storage.water > 10) ? nodes.camp : getClosestKnown(['water'], e); }
                else if (e.food < 50) { targetNode = (storage.food > 10) ? nodes.camp : getClosestKnown(['food', 'hunt'], e); }
                else if (e.stam < 25) targetNode = nodes.camp;
                else if (activeGoal) {
                    if (storage.wood < activeGoal.w) targetNode = getClosestKnown(['wood'], e);
                    else if (storage.water < activeGoal.wt) targetNode = getClosestKnown(['water'], e);
                    else if (storage.food < activeGoal.f) targetNode = getClosestKnown(['food', 'hunt'], e);
                    else {
                        targetNode = nodes.camp; 
                        if (Math.hypot(nodes.camp.x - e.x, nodes.camp.y - e.y) < 15 && e.stam > 10) {
                            constructGoal(activeGoal);
                            e.state = "Constructed " + activeGoal.name + "!";
                            activeGoal = null;
                        }
                    }
                } else {
                    if (storage.water < caps.water * 0.5) targetNode = getClosestKnown(['water'], e);
                    else if (storage.food < caps.food * 0.5) targetNode = getClosestKnown(['food', 'hunt'], e);
                    else if (storage.wood < caps.wood * 0.5) targetNode = getClosestKnown(['wood'], e);
                    if (!targetNode) targetNode = nodes.camp; 
                }
            }

            if (targetNode) {
                let dist = Math.hypot(targetNode.x - e.x, targetNode.y - e.y);
                if (dist > 15) {
                    e.state = `Going to ${targetNode.name}`;
                    e.x += ((targetNode.x - e.x) / dist) * simSpeed * speedMult;
                    e.y += ((targetNode.y - e.y) / dist) * simSpeed * speedMult;
                } else {
                    let gatherAmt = 2 * simSpeed * dt;
                    if (targetNode.stock !== Infinity) gatherAmt = Math.min(gatherAmt, targetNode.stock);
                    
                    if (targetNode.type === 'water' && gatherAmt > 0) {
                        e.wat = Math.min(100, e.wat + gatherAmt);
                        if (e.wat >= 100) storage.water = Math.min(caps.water, storage.water + gatherAmt);
                        if (targetNode.stock !== Infinity) targetNode.stock -= gatherAmt;
                        e.state = "Drinking";
                        if (targetNode === nodes.pond1 || targetNode === nodes.pond2) {
                            groundwaterResearch += 0.05 * simSpeed * dt;
                            if (groundwaterResearch >= 100 && !nodes.well.show) {
                                nodes.well.show = true;
                                document.getElementById('locks-container').innerHTML += `<div class="toggle-row"><label>Ground Water (Well)</label><input type="checkbox" onchange="toggleLock('well', this.checked)"></div>`;
                            }
                        }
                    } else if (targetNode.type === 'food' && gatherAmt > 0) {
                        e.food = Math.min(100, e.food + gatherAmt);
                        storage.food = Math.min(caps.food, storage.food + gatherAmt * 0.5);
                        if (targetNode.stock !== Infinity) targetNode.stock -= gatherAmt;
                        e.state = "Gathering";
                    } else if (targetNode.type === 'hunt' && gatherAmt > 0) {
                        e.food = Math.min(100, e.food + gatherAmt * 1.5);
                        storage.food = Math.min(caps.food, storage.food + gatherAmt);
                        e.hp -= (0.5 * simSpeed * dt);
                        if (targetNode.stock !== Infinity) targetNode.stock -= gatherAmt;
                        e.state = "Hunting (-HP Risk)";
                    } else if (targetNode.type === 'wood' && gatherAmt > 0) {
                        storage.wood = Math.min(caps.wood, storage.wood + gatherAmt);
                        e.stam -= (0.1 * simSpeed * dt);
                        if (targetNode.stock !== Infinity) targetNode.stock -= gatherAmt;
                        e.state = "Chopping Wood";
                    } else if (targetNode.type === 'med' && gatherAmt > 0) {
                        e.hp = Math.min(100, e.hp + gatherAmt * 0.5);
                        if (targetNode.stock !== Infinity) targetNode.stock -= gatherAmt;
                        e.state = "Healing";
                    } else if (targetNode.type === 'tox' && gatherAmt > 0) {
                        e.hp -= (2 * simSpeed * dt);
                        if (targetNode.stock !== Infinity) targetNode.stock -= gatherAmt;
                        e.state = "Poisoned!";
                    } else if (targetNode.type === 'camp') {
                        e.stam = Math.min(100, e.stam + 0.5 * simSpeed * dt);
                        e.state = "Resting at Camp";
                        
                        // NEW FIX: Eat and Drink directly from Camp Storage!
                        if (e.wat < 100 && storage.water > 0) {
                            let drink = Math.min(100 - e.wat, storage.water, 2 * simSpeed * dt);
                            e.wat += drink; storage.water -= drink;
                            e.state = "Drinking from Storage";
                        }
                        if (e.food < 100 && storage.food > 0) {
                            let eat = Math.min(100 - e.food, storage.food, 2 * simSpeed * dt);
                            e.food += eat; storage.food -= eat;
                            e.state = "Eating from Storage";
                        }
                        
                        for (let key in e.memory) {
                            if (!tribeKnowledge[key] || e.memory[key].lastSeenDay > tribeKnowledge[key].lastSeenDay) {
                                tribeKnowledge[key] = JSON.parse(JSON.stringify(e.memory[key]));
                            }
                        }
                        for (let key in tribeKnowledge) {
                            if (!e.memory[key] || tribeKnowledge[key].lastSeenDay > e.memory[key].lastSeenDay) {
                                e.memory[key] = JSON.parse(JSON.stringify(tribeKnowledge[key]));
                            }
                        }

                        if (!e.hasBed && entities.length > bldgs.camp.cap && simSpeed > 0) {
                            let sheltered = entities.filter(o => o.hasBed);
                            if (sheltered.length > 0) {
                                sheltered.sort((a,b) => a.hp - b.hp); 
                                let weak = sheltered[0];
                                if (e.hp > weak.hp + 10) { 
                                    e.hp -= 15; weak.hp -= 25;
                                    e.hasBed = true; weak.hasBed = false;
                                }
                            }
                        }
                    }
                }
            } else {
                if (!e.scoutTarget || Math.hypot(e.scoutTarget.x - e.x, e.scoutTarget.y - e.y) < 15) {
                    e.scoutTarget = { x: 50 + Math.random() * (w - 100), y: 50 + Math.random() * (h - 100) };
                }
                let dist = Math.hypot(e.scoutTarget.x - e.x, e.scoutTarget.y - e.y);
                e.state = isDesperate ? "Panic Searching!" : "Scouting / Wandering";
                e.x += ((e.scoutTarget.x - e.x) / dist) * simSpeed * speedMult;
                e.y += ((e.scoutTarget.y - e.y) / dist) * simSpeed * speedMult;
            }
        }

        if (simSpeed > 0 && Math.random() < 0.01 * simSpeed && entities.length < bldgs.camp.cap && storage.food >= 25) {
            let m = entities.find(e => e.sex === 'M' && e.hp >= 75 && e.state === "Resting at Camp" && e.partnerId);
            if (m) {
                let f = entities.find(e => e.id === m.partnerId && e.hp >= 75 && e.state === "Resting at Camp");
                if (f) {
                    let isM = Math.random() > 0.5;
                    entities.push({
                        id: (isM?'M':'F') + entityCounter++, sex: isM?'M':'F', 
                        x: nodes.camp.x, y: nodes.camp.y, hp: 100, stam: 100, wat: 100, food: 100, 
                        daysUnsheltered: 0, hasBed: true, partnerId: null, state: 'Just Born!', color: isM?'#3498db':'#fd79a8',
                        memory: JSON.parse(JSON.stringify(tribeKnowledge)), scoutTarget: null
                    });
                    storage.food -= 10;
                }
            }
        }
    }

    let lastTime = performance.now();
    function loop(now) {
        let dt = (now - lastTime) / 16;
        if (dt > 10) dt = 1; 
        lastTime = now;
        
        processAI(dt);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let key in nodes) {
            let n = nodes[key];
            if (!n.show) continue;
            
            ctx.fillStyle = (n.stock <= 0) ? 'rgba(0,0,0,0.5)' : n.color;
            ctx.beginPath(); ctx.arc(n.x, n.y, 25, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = 'white'; ctx.font = '12px Arial'; ctx.textAlign = 'center';
            ctx.fillText(n.name, n.x, n.y - 30);
            
            if (n.stock !== Infinity) {
                ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '10px Arial';
                ctx.fillText(`${Math.ceil(Math.max(0, n.stock))}/${n.max}`, n.x, n.y + 20);
                if (n.stock <= 0) {
                    ctx.fillStyle = '#ff6666'; ctx.font = 'bold 10px Arial';
                    ctx.fillText('DEPLETED', n.x, n.y + 4);
                }
            }
            if (n.locked && n.stock > 0) { ctx.fillStyle = 'red'; ctx.font = '20px Arial'; ctx.fillText('🔒', n.x, n.y + 8); }
        }

        entities.forEach(e => {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.beginPath(); ctx.arc(e.x, e.y, VISION_RADIUS, 0, Math.PI*2); ctx.stroke();
            
            ctx.fillStyle = e.color;
            ctx.beginPath(); ctx.arc(e.x, e.y, 10, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = 'red'; ctx.fillRect(e.x - 15, e.y - 20, 30, 4);
            ctx.fillStyle = '#2ecc71'; ctx.fillRect(e.x - 15, e.y - 20, 30 * (e.hp/100), 4);
            
            ctx.fillStyle = 'white'; ctx.font = '10px Arial'; ctx.textAlign = 'center';
            let nameTag = e.partnerId ? `${e.id} (♥${e.partnerId})` : e.id;
            ctx.fillText(nameTag, e.x, e.y + 15);
            ctx.fillText(e.state, e.x, e.y - 25);
            
            if (e.state.includes("Scouting") || e.state.includes("Panic")) { ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 14px Arial'; ctx.fillText('?', e.x + 12, e.y - 10); }
            if (!e.hasBed) { ctx.fillStyle = 'orange'; ctx.font = '10px Arial'; ctx.fillText(`Unsheltered: ${Math.floor(e.daysUnsheltered)}d`, e.x, e.y + 25); }
        });

        document.getElementById('hud-wood').innerText = `Wood: ${Math.floor(storage.wood)}/${caps.wood}`;
        document.getElementById('hud-food').innerText = `Food: ${Math.floor(storage.food)}/${caps.food}`;
        document.getElementById('hud-water').innerText = `Water: ${Math.floor(storage.water)}/${caps.water}`;
        document.getElementById('hud-pop').innerText = `Pop: ${entities.length} (Beds: ${bldgs.camp.cap})`;
        document.getElementById('hud-day').innerText = `Day: ${Math.floor(timeDay)}`;
        document.querySelector('.clickable').innerText = `☠️ Dead: ${deceased.length}`;

        requestAnimationFrame(loop);
    }

    setupUI();
    loop(performance.now());
</script>
</body>
</html>
